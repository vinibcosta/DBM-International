# Na VPS: /root/dbm-site/docker-compose.yml
# Não publica portas: o Caddy do n8n (rede n8n_default) faz o proxy e o HTTPS.
name: dbm-site

services:
  dbm-site:
    image: nginx:1.28-alpine
    container_name: dbm-site
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
