# /etc/nginx/sites-available/educationdbm.com
server {
    listen 80;
    listen [::]:80;
    server_name educationdbm.com www.educationdbm.com;

    root /var/www/dbm-site/out;
    index index.html;

    # /sobre -> sobre.html (mantém as URLs antigas do Wix)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Arquivos do Next com hash no nome podem ficar em cache "para sempre"
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens: cache de 30 dias no navegador do visitante
    location ~* \.(webp|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
