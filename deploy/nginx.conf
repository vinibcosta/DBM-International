# Nginx do container `dbm-site` (na VPS: /root/dbm-site/nginx.conf).
# HTTPS e domínio ficam no Caddy do n8n, que faz proxy para http://dbm-site:80.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Atrás do proxy: redirecionamentos relativos (sem http:// nem porta interna)
    absolute_redirect off;

    # /sobre -> sobre.html (mantém as URLs antigas do Wix)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Arquivos do Next com hash no nome podem ficar em cache "para sempre"
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imagens: cache de 30 dias no navegador do visitante
    location ~* \.(webp|png|jpe?g|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;
}
